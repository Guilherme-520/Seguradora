openapi: 3.0.3

info:
  title: Central de Chamados da Seguradora
  version: "1.1.0"
  description: |
    Ferramentas para o agente do IBM watsonx Orchestrate abrir, consultar,
    listar e atualizar chamados de atendimento da seguradora.

    Autenticação: header `X-API-Key` com o valor da variável de ambiente
    `ORCHESTRATE_API_KEY` configurada no Vercel.

    Ambiente publicado: https://seguradora-blush.vercel.app

servers:
  - url: https://seguradora-blush.vercel.app/api
    description: Produção (Vercel)

security:
  - ApiKeyAuth: []

tags:
  - name: Chamados
    description: Gerenciamento de chamados de atendimento

paths:
  /agent/tickets:
    post:
      operationId: criarChamado
      tags: [Chamados]
      summary: Abrir novo chamado
      description: |
        Abre um novo chamado de atendimento para um cliente da seguradora e
        retorna o protocolo gerado (formato SEG-AAAAMMDD-NNNNN), que deve ser
        informado ao cliente. Use quando o cliente relatar um problema,
        solicitação, dúvida ou reclamação. Se a mesma solicitação for enviada
        novamente, o chamado já existente é retornado (sem duplicar).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        "201":
          description: Chamado criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        "200":
          description: Chamado idêntico já existia e foi retornado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

    get:
      operationId: listarChamados
      tags: [Chamados]
      summary: Listar chamados
      description: |
        Lista chamados, do mais recente para o mais antigo, com filtros
        opcionais. Use para encontrar os chamados de um cliente (pelo CPF ou
        pelo nome em `search`) ou para listar chamados por status, prioridade
        ou categoria.
      parameters:
        - name: requester_cpf
          in: query
          required: false
          description: CPF do cliente (11 dígitos, com ou sem pontuação)
          schema:
            type: string
            example: "12345678900"
        - name: status
          in: query
          required: false
          description: Filtrar por status do chamado
          schema:
            $ref: '#/components/schemas/Status'
        - name: priority
          in: query
          required: false
          description: Filtrar por prioridade
          schema:
            $ref: '#/components/schemas/Priority'
        - name: category
          in: query
          required: false
          description: Filtrar por categoria
          schema:
            $ref: '#/components/schemas/Category'
        - name: search
          in: query
          required: false
          description: Texto livre buscado no nome do cliente, título, protocolo, apólice ou CPF
          schema:
            type: string
            example: "Maria Silva"
        - name: page
          in: query
          required: false
          description: Página (começa em 1)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          required: false
          description: Itens por página (máximo 100)
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Lista paginada de chamados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketListResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /agent/tickets/{protocol}:
    get:
      operationId: consultarChamado
      tags: [Chamados]
      summary: Consultar chamado por protocolo
      description: |
        Retorna os dados completos de um chamado a partir do protocolo,
        incluindo status atual, responsável, interações (comentários) e o
        histórico de alterações. Use quando o cliente perguntar sobre o
        andamento de um chamado.
      parameters:
        - $ref: '#/components/parameters/Protocol'
      responses:
        "200":
          description: Dados completos do chamado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: atualizarChamado
      tags: [Chamados]
      summary: Atualizar status, prioridade ou responsável
      description: |
        Altera o status, a prioridade e/ou o responsável de um chamado.
        Envie apenas os campos que devem mudar. A alteração fica registrada no
        histórico do chamado com origem "agente".
      parameters:
        - $ref: '#/components/parameters/Protocol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        "200":
          description: Chamado atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /agent/tickets/{protocol}/interactions:
    post:
      operationId: adicionarInteracao
      tags: [Chamados]
      summary: Adicionar comentário ao chamado
      description: |
        Registra um comentário ou nota no chamado, por exemplo uma informação
        nova passada pelo cliente. Não é permitido em chamados com status
        "encerrado".
      parameters:
        - $ref: '#/components/parameters/Protocol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddInteractionRequest'
      responses:
        "201":
          description: Comentário registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: Chamado encerrado não aceita novos comentários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Valor da variável ORCHESTRATE_API_KEY do backend

  parameters:
    Protocol:
      name: protocol
      in: path
      required: true
      description: Protocolo do chamado, no formato SEG-AAAAMMDD-NNNNN
      schema:
        type: string
        example: "SEG-20240101-00001"

  responses:
    BadRequest:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: API key ausente ou inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Chamado não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Status:
      type: string
      description: |
        Status do chamado: aberto, em_atendimento, aguardando_cliente
        (aguardando retorno do cliente), resolvido, encerrado.
      enum: [aberto, em_atendimento, aguardando_cliente, resolvido, encerrado]

    Priority:
      type: string
      description: Prioridade do chamado
      enum: [baixa, media, alta, critica]

    Category:
      type: string
      description: |
        Categoria: sinistro (acidente, roubo, dano), apolice (dados, renovação,
        coberturas), cobranca (fatura, pagamento), cancelamento, duvida,
        reclamacao, outro.
      enum: [sinistro, apolice, cobranca, cancelamento, duvida, reclamacao, outro]

    Ticket:
      type: object
      description: Chamado de atendimento
      properties:
        id:
          type: string
          format: uuid
        protocol:
          type: string
          description: Protocolo do chamado
          example: "SEG-20240101-00001"
        requester_name:
          type: string
          description: Nome do cliente
        requester_cpf:
          type: string
          nullable: true
          description: CPF do cliente (somente dígitos)
        requester_email:
          type: string
          nullable: true
        requester_phone:
          type: string
          nullable: true
        policy_number:
          type: string
          nullable: true
          description: Número da apólice
        title:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          $ref: '#/components/schemas/Status'
        assignee_name:
          type: string
          nullable: true
          description: Responsável pelo chamado
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true

    Interaction:
      type: object
      description: Comentário registrado no chamado
      properties:
        id:
          type: string
          format: uuid
        origin:
          type: string
          enum: [agente, usuario]
          description: agente = watsonx Orchestrate; usuario = equipe no painel
        author_name:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time

    HistoryEntry:
      type: object
      description: Alteração de campo do chamado
      properties:
        field_name:
          type: string
          description: Campo alterado (status, priority ou assignee)
        old_value:
          type: string
          nullable: true
        new_value:
          type: string
          nullable: true
        origin:
          type: string
          enum: [agente, usuario]
        author_name:
          type: string
        changed_at:
          type: string
          format: date-time

    TicketResponse:
      type: object
      properties:
        message:
          type: string
        ticket:
          $ref: '#/components/schemas/Ticket'

    TicketDetail:
      type: object
      properties:
        ticket:
          $ref: '#/components/schemas/Ticket'
        interactions:
          type: array
          items:
            $ref: '#/components/schemas/Interaction'
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'

    TicketListResponse:
      type: object
      properties:
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        total:
          type: integer
          description: Total de chamados encontrados
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer

    InteractionResponse:
      type: object
      properties:
        message:
          type: string
        interaction:
          $ref: '#/components/schemas/Interaction'

    CreateTicketRequest:
      type: object
      required: [requester_name, title, description]
      properties:
        requester_name:
          type: string
          description: Nome completo do cliente
          example: "Ana Costa"
        requester_cpf:
          type: string
          description: CPF do cliente, 11 dígitos (opcional)
          example: "12345678900"
        requester_email:
          type: string
          description: E-mail do cliente (opcional)
          example: "ana.costa@email.com"
        requester_phone:
          type: string
          description: Telefone do cliente com DDD (opcional)
          example: "11977770001"
        policy_number:
          type: string
          description: Número da apólice relacionada (opcional)
          example: "APL-2024-001234"
        title:
          type: string
          description: Resumo curto do problema
          example: "Sinistro: colisão traseira do veículo"
        description:
          type: string
          description: Descrição detalhada do que o cliente relatou
          example: "O veículo sofreu colisão traseira ontem. Cliente quer saber como acionar o seguro."
        category:
          $ref: '#/components/schemas/Category'
        priority:
          $ref: '#/components/schemas/Priority'
        author_name:
          type: string
          description: Nome do assistente que está abrindo o chamado (padrão "Agente WXO")

    UpdateTicketRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Status'
        priority:
          $ref: '#/components/schemas/Priority'
        assignee_name:
          type: string
          description: Nome do novo responsável pelo chamado
          example: "Fernanda Lima"
        author_name:
          type: string
          description: Nome de quem está fazendo a alteração (padrão "Agente WXO")

    AddInteractionRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: Texto do comentário
          example: "Cliente informou que enviou o boletim de ocorrência por e-mail."
        author_name:
          type: string
          description: Nome do autor do comentário (padrão "Agente WXO")

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Mensagem de erro
